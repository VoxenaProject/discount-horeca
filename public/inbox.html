<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Demandes clients | HF CONCEPT</title><meta name="robots" content="noindex"><style>body{font:16px system-ui;background:#f3f5fa;color:#1c294e;margin:0}main{max-width:1000px;margin:auto;padding:40px 20px}h1{font-size:38px}article{padding:25px;background:white;border:1px solid #dce1ec;border-radius:10px;margin:20px 0}header{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}button,select,a{min-height:44px}button{padding:12px 18px;border:0;border-radius:6px;background:#263fba;color:white;cursor:pointer}a{color:#263fba}li{margin:10px 0}.note{white-space:pre-wrap}small{color:#66738d}select{padding:10px}#error{color:#a02c20}</style></head><body><main><a href="/">← HF CONCEPT</a><h1>La boîte de réception.</h1><p>Demandes enregistrées sur le site. Aucune notification e-mail automatique n’est activée. Les rendez-vous sont des demandes à confirmer avec le client.</p><button id="refresh">Actualiser</button><p id="error" role="alert"></p><div id="records">Chargement…</div><button id="more" hidden>Charger la suite</button></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cursor=null;async function load(more=false){try{const r=await fetch('/api/inbox'+(more&&cursor?'?cursor='+encodeURIComponent(cursor):''));const d=await r.json();if(!r.ok)throw Error(d.error);const html=d.records.map(x=>`<article><header><div><b>${esc(x.reference)} · ${x.kind==='appointment'?'Rendez-vous':'Devis'}</b><p>${esc(x.name)} · ${esc(x.company)}</p><small>${new Date(x.createdAt).toLocaleString('fr-BE')}</small></div><label>Suivi <select data-id="${esc(x.requestId)}">${[['new','À traiter'],['contacted','Contacté'],['closed','Clôturé']].map(([v,l])=>`<option value="${v}" ${x.status===v?'selected':''}>${l}</option>`).join('')}</select></label></header><p><a href="mailto:${esc(x.email)}">${esc(x.email)}</a> · <a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></p>${x.kind==='appointment'?`<p>Date souhaitée : ${esc(x.date)} · ${esc(x.time)} · ${esc(x.mode)}</p>`:''}<p class="note">${esc(x.need)}</p><ul>${x.items.map(i=>`<li>${i.qty} × ${esc(i.name)} · réf. ${esc(i.reference)} · ${i.unitPriceHT} € HT / unité</li>`).join('')}</ul><p>${x.extras.map(esc).join(' · ')}</p></article>`).join('');document.querySelector('#records').innerHTML=(more?document.querySelector('#records').innerHTML:'')+(html||'<p>Aucune demande pour le moment.</p>');cursor=d.cursor;document.querySelector('#more').hidden=!cursor;document.querySelector('#error').textContent=''}catch(e){document.querySelector('#error').textContent=e.message;document.querySelector('#records').textContent='Chargement impossible.'}}
document.querySelector('#refresh').onclick=()=>load();document.querySelector('#more').onclick=()=>load(true);document.addEventListener('change',async e=>{if(!e.target.dataset.id)return;const field=e.target;field.disabled=true;try{const r=await fetch('/api/inbox',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:field.dataset.id,status:field.value})});if(!r.ok)throw Error('Statut non enregistré. Actualisez la page.')}catch(err){document.querySelector('#error').textContent=err.message}finally{field.disabled=false}});load();
</script></body></html>
